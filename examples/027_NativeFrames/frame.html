<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Inner frame</title>
<style>body{font:16px Segoe UI,Arial,sans-serif;margin:18px;background:#f2f7fc}button{padding:8px 14px}pre{white-space:pre-wrap}</style></head>
<body><h2>Frame content</h2><pre id="result">Waiting for a message...</pre>
<script>
const output=document.getElementById('result');
window.chrome.webview.addEventListener('message',event=>{
  output.textContent=JSON.stringify(event.data);
  window.chrome.webview.postMessage({type:'ack',value:event.data});
});
window.chrome.webview.postMessage({type:'ready'});
</script></body></html>
