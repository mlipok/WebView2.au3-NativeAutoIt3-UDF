<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebView2 permission request</title>
  <style>body{font:16px Segoe UI,sans-serif;margin:2rem;line-height:1.5}main{max-width:680px}button{padding:.6rem 1rem}#result{padding:1rem;background:#eef2f6}</style>
</head>
<body>
  <main>
    <h1>Geolocation permission</h1>
    <p>Click the button to request location access. The AutoIt host denies this request without reading your location.</p>
    <button id="request" type="button">Request geolocation</button>
    <p id="result">Waiting for a request.</p>
  </main>
  <script>
    document.getElementById('request').addEventListener('click', () => {
      navigator.geolocation.getCurrentPosition(
        () => { document.getElementById('result').textContent = 'Unexpectedly allowed.'; },
        error => {
          document.getElementById('result').textContent = 'Location denied (code ' + error.code + ').';
          chrome.webview.postMessage({type: error.code === 1 ? 'denied' : 'error', code: error.code});
        },
        {timeout: 5000}
      );
    });
    chrome.webview.postMessage({type: 'ready'});
  </script>
</body>
</html>
