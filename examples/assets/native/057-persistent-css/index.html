<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Persistent CSS</title>
  <style>
    body { margin: 0; padding: 32px; font: 16px/1.5 "Segoe UI", sans-serif; color: #163346; background: #f7fafb; }
    h1 { margin: 0 0 12px; font-size: 1.9rem; }
    .sample { padding: 24px; border: 2px solid #45769b; border-radius: 8px; background-color: rgb(223, 237, 249); }
    .sample strong { display: block; font-size: 1.25rem; }
  </style>
</head>
<body>
  <h1 id="heading">Document A</h1>
  <div class="sample"><strong>Style target</strong></div>
  <script>
    const page = new URLSearchParams(location.search).get("page");
    if (page === "A" || page === "B") document.getElementById("heading").textContent = "Document " + page;
  </script>
</body>
</html>
