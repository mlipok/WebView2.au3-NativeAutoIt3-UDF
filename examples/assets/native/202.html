<!doctype html><html lang="en"><meta charset="utf-8"><title>HTML form</title><style>body{font:16px/1.6 "Segoe UI",sans-serif;margin:24px;color:#223;background:#f7f9fc}h1{font-size:25px}button,input,select,textarea{font:inherit;padding:7px;margin:3px}button{cursor:pointer}textarea{width:95%;height:190px;font-family:Consolas,monospace}pre{white-space:pre-wrap;background:#e8eef6;padding:16px}table{border-collapse:collapse}td,th{border:1px solid #bcc9dc;padding:6px 12px}th{cursor:pointer;background:#dce6f5}details{margin-left:18px}mark{background:gold}.wip{border-left:6px solid #d88900;padding:12px;background:#fff0cb}nav{display:flex;gap:8px}input[type=checkbox]{width:20px;height:20px}</style><h1>HTML form</h1><form id="form"><label>Name <input name="name" required value="Jan"></label><label>Email <input name="email" type="email" required value="jan@example.test"></label><label><input name="agree" type="checkbox">Consent</label><button>Submit</button></form><pre id="result"></pre><script>window.send = text => window.chrome.webview.postMessage(String(text));
window.demoResult = () => document.title;
window.demoCheck = () => !!document.querySelector('h1');
document.getElementById('form').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));document.getElementById('result').textContent=JSON.stringify(data,null,2);send(JSON.stringify(data))};
window.demoCheck=()=>{return document.getElementById('form').checkValidity() && document.querySelector('[name=email]').type==='email';};</script></html>
