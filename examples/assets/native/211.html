<!doctype html><html lang="en"><meta charset="utf-8"><title>Two WebView2 instances</title><style>body{font:16px/1.6 "Segoe UI",sans-serif;margin:24px;color:#223;background:#f7f9fc}h1{font-size:25px}button,input,select,textarea{font:inherit;padding:7px;margin:3px}button{cursor:pointer}textarea{width:95%;height:190px;font-family:Consolas,monospace}pre{white-space:pre-wrap;background:#e8eef6;padding:16px}table{border-collapse:collapse}td,th{border:1px solid #bcc9dc;padding:6px 12px}th{cursor:pointer;background:#dce6f5}details{margin-left:18px}mark{background:gold}.wip{border-left:6px solid #d88900;padding:12px;background:#fff0cb}nav{display:flex;gap:8px}input[type=checkbox]{width:20px;height:20px}</style><h1>Two WebView2 instances</h1><p>Select part of this text and click a button. Each pane has its own WebView2 controller.</p><button onclick="send('MESSAGE|'+document.title)">Message from pane</button><button onclick="send('SEARCH|'+getSelection().toString())">Search selection in left pane</button><p id="native">Messages from AutoIt will appear here.</p><script>window.send = text => window.chrome.webview.postMessage(String(text));
window.chrome.webview.addEventListener('message', event => document.getElementById('native').textContent=String(event.data));
window.demoResult = () => document.title;
window.demoCheck = () => !!document.querySelector('h1');

window.demoCheck=()=>{return !!window.chrome.webview && typeof getSelection==='function';};</script></html>
