<!doctype html><html lang="en"><meta charset="utf-8"><title>JavaScript: forwarding console messages</title><style>body{font:16px/1.6 "Segoe UI",sans-serif;margin:24px;color:#223;background:#f7f9fc}h1{font-size:25px}button,input,select,textarea{font:inherit;padding:7px;margin:3px}button{cursor:pointer}textarea{width:95%;height:190px;font-family:Consolas,monospace}pre{white-space:pre-wrap;background:#e8eef6;padding:16px}table{border-collapse:collapse}td,th{border:1px solid #bcc9dc;padding:6px 12px}th{cursor:pointer;background:#dce6f5}details{margin-left:18px}mark{background:gold}.wip{border-left:6px solid #d88900;padding:12px;background:#fff0cb}nav{display:flex;gap:8px}input[type=checkbox]{width:20px;height:20px}</style><h1>JavaScript: forwarding console messages</h1><button onclick="console.log('Message from console.log',42)">console.log → AutoIt</button><button onclick="console.error('Sample error')">console.error → AutoIt</button><button onclick="send(JSON.stringify({time:Date.now(),title:document.title}))">JSON result</button><script>window.send = text => window.chrome.webview.postMessage(String(text));
window.demoResult = () => document.title;
window.demoCheck = () => !!document.querySelector('h1');
for(const type of ['log','warn','error']){const original=console[type].bind(console);console[type]=(...args)=>{original(...args);send(type+': '+args.map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' '))}}
window.demoCheck=()=>{console.log('SMOKE_CONSOLE');return typeof console.log==='function';};</script></html>
