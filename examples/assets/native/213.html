<!doctype html><html lang="en"><meta charset="utf-8"><title>JSON Tree</title><style>body{font:16px/1.6 "Segoe UI",sans-serif;margin:24px;color:#223;background:#f7f9fc}h1{font-size:25px}button,input,select,textarea{font:inherit;padding:7px;margin:3px}button{cursor:pointer}textarea{width:95%;height:190px;font-family:Consolas,monospace}pre{white-space:pre-wrap;background:#e8eef6;padding:16px}table{border-collapse:collapse}td,th{border:1px solid #bcc9dc;padding:6px 12px}th{cursor:pointer;background:#dce6f5}details{margin-left:18px}mark{background:gold}.wip{border-left:6px solid #d88900;padding:12px;background:#fff0cb}nav{display:flex;gap:8px}input[type=checkbox]{width:20px;height:20px}</style><h1>JSON Tree</h1><textarea id="json">{"AutoIt":{"native":true,"versions":["x86","x64"]},"unicode":"ąćę"}</textarea><button onclick="setJSON(document.getElementById('json').value)">Show tree</button><input id="find" placeholder="Search key/value"><button onclick="findNext()">Find next</button><button onclick="document.querySelectorAll('details').forEach(e=>e.open=true)">Expand</button><button onclick="document.querySelectorAll('details').forEach(e=>e.open=false)">Collapse</button><div id="tree"></div><script>window.send = text => window.chrome.webview.postMessage(String(text));
window.demoResult = () => document.title;
window.demoCheck = () => !!document.querySelector('h1');

function branch(value,key){if(value&&typeof value==='object'){const d=document.createElement('details');d.open=true;const s=document.createElement('summary');s.textContent=key+' '+(Array.isArray(value)?'['+value.length+']':'{}');d.append(s);for(const[k,v]of Object.entries(value))d.append(branch(v,k));return d}const p=document.createElement('p');p.textContent=key+': '+JSON.stringify(value);return p}
window.setJSON=text=>{try{const v=JSON.parse(text);document.getElementById('json').value=text;document.getElementById('tree').replaceChildren(branch(v,'root'));return true}catch(e){send(e.message);return false}};
let last=-1;function findNext(){const term=document.getElementById('find').value.toLowerCase(), nodes=[...document.querySelectorAll('#tree summary,#tree p')];nodes.forEach(e=>e.style.background='');const hits=nodes.filter(e=>e.textContent.toLowerCase().includes(term));if(!hits.length)return;last=(last+1)%hits.length;hits[last].style.background='gold';for(let p=hits[last].parentElement;p;p=p.parentElement)if(p.tagName==='DETAILS')p.open=true;hits[last].scrollIntoView({block:'center'})}
setJSON(document.getElementById('json').value);

window.demoCheck=()=>{return document.querySelectorAll('#tree summary').length===3 && setJSON(document.getElementById('json').value);};</script></html>
