<!doctype html><html lang="en"><meta charset="utf-8"><title>Modern sidebar</title><style>body{font:16px/1.6 "Segoe UI",sans-serif;margin:24px;color:#223;background:#f7f9fc}h1{font-size:25px}button,input,select,textarea{font:inherit;padding:7px;margin:3px}button{cursor:pointer}textarea{width:95%;height:190px;font-family:Consolas,monospace}pre{white-space:pre-wrap;background:#e8eef6;padding:16px}table{border-collapse:collapse}td,th{border:1px solid #bcc9dc;padding:6px 12px}th{cursor:pointer;background:#dce6f5}details{margin-left:18px}mark{background:gold}.wip{border-left:6px solid #d88900;padding:12px;background:#fff0cb}nav{display:flex;gap:8px}input[type=checkbox]{width:20px;height:20px}</style><h1>Modern sidebar</h1><div style="display:flex;gap:24px"><nav style="flex-direction:column;width:180px"><button onclick="select('Home')">🏠 Home</button><button onclick="select('Files')">📁 Files</button><button onclick="select('Settings')">⚙️ Settings</button><button onclick="select('About')">ℹ️ About</button></nav><main id="panel">Select a menu item.</main></div><script>window.send = text => window.chrome.webview.postMessage(String(text));
window.demoResult = () => document.title;
window.demoCheck = () => !!document.querySelector('h1');
function select(name){document.getElementById('panel').textContent='Selected: '+name;send('MENU|'+name)}
window.demoCheck=()=>{select('Files');return document.getElementById('panel').textContent==='Selected: Files';};</script></html>
