<!doctype html><html lang="en"><meta charset="utf-8"><title>CSV Editor</title><style>body{font:16px/1.6 "Segoe UI",sans-serif;margin:24px;color:#223;background:#f7f9fc}h1{font-size:25px}button,input,select,textarea{font:inherit;padding:7px;margin:3px}button{cursor:pointer}textarea{width:95%;height:190px;font-family:Consolas,monospace}pre{white-space:pre-wrap;background:#e8eef6;padding:16px}table{border-collapse:collapse}td,th{border:1px solid #bcc9dc;padding:6px 12px}th{cursor:pointer;background:#dce6f5}details{margin-left:18px}mark{background:gold}.wip{border-left:6px solid #d88900;padding:12px;background:#fff0cb}nav{display:flex;gap:8px}input[type=checkbox]{width:20px;height:20px}</style><h1>CSV Editor</h1><p>Open a CSV file with the AutoIt button. Click a header to sort rows.</p><label>Separator <select id="delimiter"><option value=",">Comma</option><option value=";">Semicolon</option><option value="&#9;">Tab</option></select></label><button onclick="addRow()">Add row</button><button onclick="if(data.length>1){data.pop();paint()}">Remove last</button><button onclick="send('SAVE_CSV|'+getCSV())">Save</button><div id="table"></div><script>window.send = text => window.chrome.webview.postMessage(String(text));
window.demoResult = () => document.title;
window.demoCheck = () => !!document.querySelector('h1');
const EDITABLE=true;
let delimiter=',',data=[];
function parseCSV(text,sep=','){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===sep&&!quoted){row.push(field);field=''}else if((c==='\r'||c==='\n')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);rows.push(row);row=[];field=''}else field+=c}if(quoted)throw Error('Unclosed quoted field');if(field||row.length){row.push(field);rows.push(row)}return rows}
function paint(){const table=document.createElement('table');data.forEach((row,i)=>{const tr=document.createElement('tr');row.forEach((value,j)=>{const cell=document.createElement(i?'td':'th');cell.textContent=value;if(i){cell.contentEditable=EDITABLE;cell.oninput=()=>{data[i][j]=cell.textContent}}else cell.onclick=()=>{const header=data.shift();data.sort((a,b)=>String(a[j]??'').localeCompare(String(b[j]??''),undefined,{numeric:true}));data.unshift(header);paint()};tr.append(cell)});table.append(tr)});document.getElementById('table').replaceChildren(table)}
window.setCSV=text=>{try{delimiter=document.getElementById('delimiter').value;data=parseCSV(text,delimiter);paint();return true}catch(e){send(e.message);return false}};
window.getCSV=()=>data.map(row=>row.map(value=>{const v=String(value??'');return /["\r\n]/.test(v)||v.includes(delimiter)?'"'+v.replaceAll('"','""')+'"':v}).join(delimiter)).join('\r\n');
window.addRow=()=>{if(!EDITABLE)return false;data.push(Array(data[0]?.length??3).fill(''));paint();return true};
window.demoResult=()=>getCSV();
setCSV('Name,Value,Note\r\nAutoIt,123,"Comma, quoted"\r\nUnicode,ąćę,"Line 1\nLine 2"');

window.demoCheck=()=>{const sample='A,B\r\n"a,b","two\nlines"\r\n"a""b",x';const r=parseCSV(sample);return r.length===3&&r[1][0]==='a,b'&&r[2][0]==='a"b'&&data.length===3;};</script></html>
