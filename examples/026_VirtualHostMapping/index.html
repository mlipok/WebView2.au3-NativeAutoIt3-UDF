<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebView2 virtual host mapping</title>
  <link rel="stylesheet" href="site.css">
  <script src="site.js" defer></script>
</head>
<body>
  <main>
    <h1>Local files through a virtual HTTPS host</h1>
    <p>This HTML page, its stylesheet and its JavaScript file live beside the AutoIt example.</p>
    <p>Address: <code id="origin"></code></p>
    <p id="state">Loading local JavaScript...</p>
    <button id="send" type="button">Send a message to AutoIt</button>
    <p>No HTTP server and no Internet connection are required.</p>
  </main>
</body>
</html>
